name: dsh-registry-local

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: registry
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-registry.sh:/docker-entrypoint-initdb.d/10-registry.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d registry"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 128mb
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    name: dsh-registry-postgres-data

secrets:
  postgres_admin_password:
    file: ../../.artifacts/postgres/private/admin-password
  postgres_app_password:
    file: ../../.artifacts/postgres/private/app-password
