# Production Harness-to-Registry A2A foundation. The Web app owns the HTTPS
# authority/key bridge, durable publication runtime, and authenticated WSS
# import/refresh plus automatic text-question attachments. The independently
# enrolled dshb1 credential is used only by the HTTPS bridge; the dsh1
# credential remains WSS-only.

- id: web-runtime
  inject:
    - webStartup
    - credentials
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
    productionRegistryConnection:
      mode: production
      organizationId: !!js process.env.DSH_REGISTRY_ORGANIZATION_ID
      instanceId: !!js process.env.DSH_INSTANCE_ID
      tokenEnv: DSH_REGISTRY_DEVICE_TOKEN
      privateKeyEnv: DSH_REGISTRY_DEVICE_PRIVATE_KEY
      transport:
        url: !!js process.env.DSH_REGISTRY_SYNC_URL
        handshakeTimeoutMs: 10000
        requestTimeoutMs: 10000
        heartbeatIntervalMs: 10000
        pollIntervalMs: 1000
        maxFrameBytes: 1048576
        maxSendBufferBytes: 2097152
        maxConnections: 110
        maxPendingQuestionOperations: 100
        retryBaseMs: 500
        retryCapMs: 30000
        retryJitterMin: 0.5
        retryJitterMax: 1
    productionDisclosureHttpsBridge:
      mode: https-bridge
      url: !!js process.env.DSH_REGISTRY_DISCLOSURE_BRIDGE_URL
      tokenEnv: DSH_REGISTRY_DISCLOSURE_TOKEN
      requestTimeoutMs: 10000
      maxResponseBytes: 1048576
      maxAudienceEntries: 10000
      maxDisplayNameCharacters: 256
    productionDisclosurePublication:
      mode: production
      storageRoot: !!js process.env.DSH_DISCLOSURE_STATE_PATH
      producer:
        maxSnapshotBytes: 16777216
        maxBatchEvents: 100
        maxPublications: 100
        maxMappingRecordBytes: 65536
      crypto:
        maxPlaintextBytes: 65536
        maxCiphertextBytes: 262144
        maxTrustedKeys: 4
    productionRegistryDisclosureImport:
      pollIntervalMs: 1000
      limits:
        maxEvents: 100
        maxEncryptedBytes: 8388608
        maxTextBytes: 1048576
        maxDisplayCharacters: 2000
      cryptoLimits:
        maxPlaintextBytes: 65536
        maxCiphertextBytes: 262144
        maxTrustedKeys: 4
      maxRetainedBytes: 16777216
    productionRegistryQuestionConsumer:
      handling: automatic
      localModel:
        provider: deepseek-official
        model: deepseek-flash
      modelCredentialEnv: DEEPSEEK_API_KEY
      pollIntervalMs: 1000
      maxClaims: 10000
      mailboxLimits:
        maxTextBytes: 16384
        maxTextCharacters: 8192
        maxCiphertextBytes: 32768
        maxAggregateBytes: 16777216
        maxRequests: 10000
        maxRetainedRequests: 100000
        maxPendingOperations: 256
        maxLifetimeMs: 604800000
      contextLimits:
        maxEvents: 100
        maxEncryptedBytes: 8388608
        maxTextBytes: 1048576
        maxDisplayCharacters: 2000
      cryptoLimits:
        maxPlaintextBytes: 65536
        maxCiphertextBytes: 262144
        maxTrustedKeys: 4
      maxQuestionBytes: 16384
      maxQuestionCharacters: 8192
      maxMessageBytes: 8388608

# Session Controller exposes the local disclosure preview and receives the
# production publication/refresh services and isolated automatic question turns
# installed by the Web app. The fixed route is text-only and has no tools.
- id: session-controller
  config:
    disclosurePreview:
      maxObservedEvents: 5000
      maxObservedBytes: 16777216
      maxResponseBytes: 4194304
      maxExcludedSourceSeqs: 2000
      policy:
        maxTextCharacters: 32000
        maxToolSummaryCharacters: 4000
        maxEventBytes: 160000
        blockedText: []
