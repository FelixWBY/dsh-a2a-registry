# Deployment-owned final production overlay. Install a copy at
# /etc/dsh/registry-production.patch.yml and add only reviewed production
# providers or overrides. The Registry service applies the checked single-host
# and PostgreSQL layers before this file.
# The PostgreSQL production layer already mounts the explicitly single-instance
# software-local disclosure-key provider, the bounded fixed-checkpoint content
# provider and the authenticated publication bridge. The key provider's root
# key must come from the environment-only credentials owner.
# Replace that provider with an HSM/KMS-backed implementation before running
# multiple Registry replicas; never add a second key provider beside it.
#
# Do not add or replace the fixed registry-disclosure-content-provider here;
# the production graph pins its package, key-provider injection and explicit
# resource bounds in the PostgreSQL layer. A deployment-owned Stripe or Alipay
# adapter follows its own lifecycle rule:
# use the fixed entry id registry-billing-provider, explicitly set
# registry-runtime.config.saas.billingProvider to true, and include
# registryBillingProvider in the complete registry-runtime inject list. Without
# all three declarations checkout and the unauthenticated webhook route remain
# closed; this example intentionally contains no merchant implementation.
