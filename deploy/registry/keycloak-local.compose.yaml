name: dsh-registry-keycloak-local

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: [start-dev, --http-host=0.0.0.0, --http-port=8080, --import-realm, --health-enabled=true]
    ports:
      - "127.0.0.1:3182:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?required}
      DSH_LOCAL_OIDC_CLIENT_SECRET: ${DSH_LOCAL_OIDC_CLIENT_SECRET:?required}
      DSH_LOCAL_OIDC_USER_PASSWORD: ${DSH_LOCAL_OIDC_USER_PASSWORD:?required}
      DSH_LOCAL_REGISTRY_ORIGIN: ${DSH_LOCAL_REGISTRY_ORIGIN:-http://127.0.0.1:3181}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-local-realm.example.json:/opt/keycloak/data/import/dsh-local-realm.json:ro
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  keycloak_data:
    name: dsh-registry-keycloak-local-data
