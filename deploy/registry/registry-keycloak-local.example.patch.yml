# Local OIDC/WSS acceptance profile. Keycloak uses loopback HTTP while Caddy
# terminates a development-only internal CA certificate for device sync.

- id: registry-webserver
  config:
    host: 127.0.0.1
    port: 3181
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- insert:
    - id: registry-local-oidc-storage
      name: '@deepseek-ai/dsh-storage'

    - id: registry-local-oidc-storage-postgres
      name: '@deepseek-ai/dsh-storage-postgres'
      config:
        connectionString: !!js process.env.DSH_REGISTRY_POSTGRES_URL
        schema: registry_saas_local
        schemaMode: validate
        # Temporary local-only bridge while legacy schemas share this database.
        allowUnsafeSharedDatabase: true
        maxConnections: 4
        idleTimeoutMs: 30000
        statementTimeoutMs: 15000

    - id: registry-local-oidc-storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: postgres

    - id: registry-local-oidc-credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        watch: false

- id: registry-runtime
  inject: [storageDomain, credentials]
  config:
    printUrl: true
    saas:
      databaseUrlEnv: DSH_REGISTRY_POSTGRES_URL
      schema: registry_saas_local
      schemaMode: validate
      allowUnsafeSharedDatabase: true
      legacyOrganizationName: 本地迁移组织
      maxConnections: 2
      maxOrganizationsPerAccount: 5
      maxActiveOrganizations: 64
      idleTimeoutMs: 30000
      statementTimeoutMs: 15000
    oidc:
      mode: loopback-development
      issuer: http://127.0.0.1:3182/realms/dsh-local
      clientId: dsh-registry
      clientSecretEnv: DSH_LOCAL_OIDC_CLIENT_SECRET
      sessionSecretEnv: DSH_LOCAL_REGISTRY_SESSION_SECRET
      publicOrigin: http://127.0.0.1:3181
      organizationId: local-oidc-org
      memberIdClaim: preferred_username
      scopes: openid profile email
      sessionValidation: introspection
      maxActiveSessions: 1024
      maxSessionsPerSubject: 8
      sessionTtlMs: 3600000
      transactionTtlMs: 300000
      maxAuthenticationAgeSeconds: 3600
      clockToleranceSeconds: 30
      requestTimeoutMs: 10000
      maxCookieBytes: 8192
      maxDirectoryBytes: 1048576
    api:
      pageSize: 50
      maxValueBytes: 262144
      maxCursorBytes: 4096
      maxOperationInputBytes: 16384
      admission:
        directPeer:
          capacity: 20
          refillPerSecond: 5
          maxEntries: 256
        account:
          capacity: 10
          refillPerSecond: 2
          maxEntries: 4096
    ingest:
      organizationId: local-oidc-org
      imports:
        maxOperations: 2000
        maxRecordBytes: 4096
        maxAuthorizationResponseBytes: 262144
        maxDeliveryBytes: 261120
        deliveryTimeoutMs: 15000
      questions:
        mailboxKeyEnv: DSH_LOCAL_REGISTRY_MAILBOX_KEY
        maxAuthorizationResponseBytes: 262144
        maxDeliveryBytes: 261120
        operationTimeoutMs: 15000
        executionLeaseMs: 30000
        limits:
          maxTextBytes: 8192
          maxTextCharacters: 4096
          maxCiphertextBytes: 16384
          maxAggregateBytes: 32768
          maxRequests: 2000
          maxRetainedRequests: 10000
          maxPendingOperations: 64
          maxLifetimeMs: 604800000
        expiryMaintenance:
          intervalMs: 60000
          maxItems: 100
      limits:
        maxInputBytes: 65536
        maxAggregateBytes: 1048576
        maxEvents: 100
        maxCheckpoints: 20
        maxDisclosures: 20
        maxAuditEntries: 1000
      audit:
        failurePolicy: block-all
        maxOperations: 5000
        maxRecordBytes: 4096
      directory:
        maxMembers: 20
        maxTeams: 10
        maxTeamMembers: 20
        maxNameBytes: 128
        maxBytes: 65536
        bootstrapOwner:
          memberId: registry-owner
          displayName: Registry Owner
      bindings:
        audience: wss://localhost:3183/a2a/v1/sync
        ttlMs: 600000
        maxRecordBytes: 8192
        maxBindings: 20
        maxNameBytes: 128
      sync:
        audience: wss://localhost:3183/a2a/v1/sync
        tlsTermination: loopback-proxy
        maxConnections: 32
        maxFrameBytes: 262144
        maxSendBufferBytes: 524288
        handshakeTimeoutMs: 10000
        idleTimeoutMs: 30000
        admission:
          upgrades: { capacity: 40, refillPerSecond: 10 }
          frames:
            requests: { capacity: 200, refillPerSecond: 50 }
            bytes: { capacity: 8388608, refillPerSecond: 2097152 }
          handshakes: { capacity: 40, refillPerSecond: 10 }
          organizations:
            maxEntries: 64
            requests: { capacity: 200, refillPerSecond: 50 }
            bytes: { capacity: 8388608, refillPerSecond: 2097152 }
          instances:
            maxEntries: 256
            requests: { capacity: 100, refillPerSecond: 25 }
            bytes: { capacity: 4194304, refillPerSecond: 1048576 }
          disclosures:
            maxEntries: 2048
            requests: { capacity: 50, refillPerSecond: 10 }
            bytes: { capacity: 2097152, refillPerSecond: 524288 }

- id: ui-registry
  config:
    localTestIdentityBanner: true
    defaultTheme: dark
