# Apply after registry-single-host.example.patch.yml to route authoritative
# Registry domains to PostgreSQL. Shared admission and alert outbox remain
# separate SQLite owners until their multi-host replacements are selected.

- insert:
    - id: registry-storage-postgres
      name: '@deepseek-ai/dsh-storage-postgres'
      config:
        connectionString: !!js process.env.DSH_REGISTRY_POSTGRES_URL
        schema: registry
        schemaMode: validate
        maxConnections: 8
        idleTimeoutMs: 30000
        statementTimeoutMs: 15000

- id: registry-storage-domain
  config:
    backend: postgres

- id: registry-runtime
  config:
    printUrl: false
    oidc:
      mode: production
      issuer: !!js process.env.DSH_REGISTRY_OIDC_ISSUER
      clientId: !!js process.env.DSH_REGISTRY_OIDC_CLIENT_ID
      clientSecretEnv: DSH_REGISTRY_OIDC_CLIENT_SECRET
      sessionSecretEnv: DSH_REGISTRY_SESSION_SECRET
      publicOrigin: !!js process.env.DSH_REGISTRY_PUBLIC_ORIGIN
      organizationId: !!js process.env.DSH_REGISTRY_ORGANIZATION_ID
      memberIdClaim: dsh_member_id
      legacyOwnerSubject: !!js process.env.DSH_REGISTRY_LEGACY_OWNER_SUBJECT
      scopes: openid profile email
      sessionValidation: introspection
      maxActiveSessions: 10000
      maxSessionsPerSubject: 8
      sessionTtlMs: 3600000
      transactionTtlMs: 300000
      maxAuthenticationAgeSeconds: 3600
      clockToleranceSeconds: 30
      requestTimeoutMs: 10000
      maxCookieBytes: 8192
      maxDirectoryBytes: 10485760
    saas:
      databaseUrlEnv: DSH_REGISTRY_POSTGRES_URL
      schema: registry
      schemaMode: validate
      legacyOrganizationName: !!js process.env.DSH_REGISTRY_ORGANIZATION_NAME
      maxConnections: 4
      maxOrganizationsPerAccount: 5
      maxActiveOrganizations: 256
      idleTimeoutMs: 30000
      statementTimeoutMs: 15000
    sharedAdmission:
      path: !!js process.env.DSH_REGISTRY_ADMISSION_SQLITE_PATH
      namespace: registry-production-v1
      keySecretEnv: DSH_REGISTRY_ADMISSION_HMAC
      busyTimeoutMs: 2000
      journalMode: wal
      audit:
        maxEntries: 100000
        aggregationWindowMs: 60000
    api:
      pageSize: 50
      maxValueBytes: 262144
      maxCursorBytes: 4096
      maxOperationInputBytes: 16384
      maxBillingWebhookBytes: 262144
      admission:
        directPeer:
          capacity: 60
          refillPerSecond: 10
          maxEntries: 4096
        account:
          capacity: 30
          refillPerSecond: 5
          maxEntries: 16384
        trustedProxy:
          cidrs:
            - 127.0.0.1/32
          maxForwardedBytes: 1024
          maxForwardedEntries: 8
    ingest:
      organizationId: !!js process.env.DSH_REGISTRY_ORGANIZATION_ID
      limits:
        maxInputBytes: 65536
        maxAggregateBytes: 4194304
        maxEvents: 1000
        maxCheckpoints: 100
        maxDisclosures: 100000
        maxAuditEntries: 1000000
      audit:
        failurePolicy: block-all
        maxOperations: 1000000
        maxRecordBytes: 4096
      alerts:
        endpoint: !!js process.env.DSH_REGISTRY_ALERT_ENDPOINT
        bearerTokenEnv: DSH_REGISTRY_ALERT_BEARER_TOKEN
        maxPendingAlerts: 10000
        deliveryAttempts: 8
        timeoutMs: 5000
        retryDelayMs: 5000
        outbox:
          path: !!js process.env.DSH_REGISTRY_ALERT_OUTBOX_SQLITE_PATH
          namespace: registry-production-alerts-v1
          leaseMs: 15000
          failedRetentionMs: 2592000000
          busyTimeoutMs: 2000
          journalMode: wal
      maintenance:
        intervalMs: 30000
        maxItems: 100
      directory:
        maxMembers: 100000
        maxTeams: 10000
        maxTeamMembers: 100000
        maxNameBytes: 256
        maxBytes: 104857600
        bootstrapOwner:
          memberId: !!js process.env.DSH_REGISTRY_BOOTSTRAP_MEMBER_ID
          displayName: !!js process.env.DSH_REGISTRY_BOOTSTRAP_MEMBER_NAME
      bindings:
        audience: !!js process.env.DSH_REGISTRY_SYNC_AUDIENCE
        ttlMs: 600000
        maxRecordBytes: 8192
        maxBindings: 100000
        maxNameBytes: 256
      sync:
        audience: !!js process.env.DSH_REGISTRY_SYNC_AUDIENCE
        tlsTermination: loopback-proxy
        maxConnections: 10000
        maxFrameBytes: 1048576
        maxSendBufferBytes: 2097152
        handshakeTimeoutMs: 10000
        idleTimeoutMs: 30000
        admission:
          upgrades: { capacity: 200, refillPerSecond: 50 }
          frames:
            requests: { capacity: 2000, refillPerSecond: 500 }
            bytes: { capacity: 67108864, refillPerSecond: 16777216 }
          handshakes: { capacity: 400, refillPerSecond: 100 }
          organizations:
            maxEntries: 16
            requests: { capacity: 2000, refillPerSecond: 500 }
            bytes: { capacity: 67108864, refillPerSecond: 16777216 }
          instances:
            maxEntries: 100000
            requests: { capacity: 1000, refillPerSecond: 250 }
            bytes: { capacity: 33554432, refillPerSecond: 8388608 }
          disclosures:
            maxEntries: 1000000
            requests: { capacity: 500, refillPerSecond: 100 }
            bytes: { capacity: 16777216, refillPerSecond: 4194304 }
      imports:
        maxOperations: 10000
        maxRecordBytes: 4096
        maxAuthorizationResponseBytes: 262144
        maxDeliveryBytes: 1047552
        deliveryTimeoutMs: 15000
      questions:
        mailboxKeyEnv: DSH_REGISTRY_MAILBOX_KEY
        maxAuthorizationResponseBytes: 262144
        maxDeliveryBytes: 1047552
        operationTimeoutMs: 15000
        executionLeaseMs: 30000
        limits:
          maxTextBytes: 16384
          maxTextCharacters: 8192
          maxCiphertextBytes: 32768
          maxAggregateBytes: 65536
          maxRequests: 10000
          maxRetainedRequests: 100000
          maxPendingOperations: 256
          maxLifetimeMs: 604800000
        expiryMaintenance:
          intervalMs: 60000
          maxItems: 500
